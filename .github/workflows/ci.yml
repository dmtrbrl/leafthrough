# Checks every push and pull request: types, the library build, the browser tests, and the
# packed tarball in a clean project. The tests also run against the oldest peers the README
# promises and the newest ones; the weekly run catches a new three.js release breaking the
# shader patches. On main, once all of that passes, a new version in package.json is published
# to npm and released on GitHub (see RELEASING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install the packed tarball in a clean project and import every entry point
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/leafthrough-*.tgz three react vue svelte
          node --input-type=module -e "
            for (const entry of ['leafthrough', 'leafthrough/element', 'leafthrough/react', 'leafthrough/vue', 'leafthrough/svelte']) await import(entry)
          "

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        peers: [locked, minimum, latest]
    name: test (${{ matrix.peers }} peers)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.peers == 'minimum'
        run: npm install --no-save --legacy-peer-deps three@0.160.0 react@18.2.0 react-dom@18.2.0 vue@3.3.0 svelte@4.0.0
      - if: matrix.peers == 'latest'
        run: npm install --no-save --legacy-peer-deps three@latest react@latest react-dom@latest vue@latest svelte@latest
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Publishes the version in package.json if npm doesn't have it yet, then tags it and makes a
  # GitHub release from its CHANGELOG section. Each step checks what's missing, so a re-run
  # picks up where a failed one stopped. npm trusts this workflow (trusted publishing), so no
  # token is stored anywhere; the very first version was published by hand.
  publish:
    needs: [check, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write # the tag and release
      id-token: write # trusted publishing, and the provenance it attaches
    steps:
      - uses: actions/checkout@v7
      - name: Find what's left to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! npm view "$name" name > /dev/null 2>&1; then
            echo "::notice::$name isn't on npm yet. Publish the first version by hand (see RELEASING.md)."
            exit 0
          fi
          publish=$([ -z "$(npm view "$name@$version" version 2>/dev/null)" ] && echo true || true)
          release=$(gh release view "v$version" > /dev/null 2>&1 || echo true)
          if [ -z "$publish$release" ]; then
            echo "$version is already published and released."
            exit 0
          fi
          # the release notes come from the changelog; better to stop before publishing than after
          awk -v heading="## [$version]" '
            index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::No notes for $version. Add a '## [$version]' section."
            exit 1
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; esac

      - if: steps.plan.outputs.publish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - if: steps.plan.outputs.publish
        run: npm install -g npm@latest
      - if: steps.plan.outputs.publish
        run: npm ci
      # prepublishOnly builds the package; a prerelease goes out under `next`, not `latest`
      - if: steps.plan.outputs.publish
        run: npm publish --tag ${{ steps.plan.outputs.prerelease && 'next' || 'latest' }}

      - name: Tag and release on GitHub
        if: steps.plan.outputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: >
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION"
          --notes-file "$RUNNER_TEMP/notes.md" ${{ steps.plan.outputs.prerelease && '--prerelease' || '' }}
